<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Personal Voice Agent</title>
  <style>
    /* Theme tokens keep the page comfortable in either system color scheme. */
    :root {
      color-scheme: light;
      --page: #f5f7fb;
      --surface: #ffffff;
      --surface-muted: #f1f4f9;
      --ink: #172033;
      --muted: #647087;
      --line: #e1e6ef;
      --accent: #6158df;
      --accent-strong: #4c43c8;
      --accent-soft: #eeedff;
      --user-bubble: #6158df;
      --user-ink: #ffffff;
      --error: #b42318;
      --error-bg: #fff0ee;
      --meter-track: #e4e6f4;
      --shadow: 0 18px 48px rgb(23 32 51 / 8%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #10131b;
        --surface: #191e29;
        --surface-muted: #222938;
        --ink: #edf0f8;
        --muted: #a1abc0;
        --line: #303849;
        --accent: #a39cff;
        --accent-strong: #b5b0ff;
        --accent-soft: #292743;
        --user-bubble: #625bd0;
        --user-ink: #ffffff;
        --error: #ffb4a9;
        --error-bg: #3a2225;
        --meter-track: #34394b;
        --shadow: 0 18px 48px rgb(0 0 0 / 24%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 28px 20px;
      background:
        radial-gradient(ellipse at 50% -18%, rgb(111 103 240 / 12%), transparent 48%),
        var(--page);
      color: var(--ink);
    }

    button, input { font: inherit; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 72%, transparent);
      outline-offset: 3px;
    }

    .app {
      width: min(100%, 900px);
      min-height: min(850px, calc(100vh - 56px));
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 26px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .brand-mark svg { width: 22px; height: 22px; }
    h1 { margin: 0; font-size: 17px; font-weight: 720; letter-spacing: -0.025em; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: background-color 160ms ease, border-color 160ms ease, transform 160ms ease;
    }

    .button:hover:not(:disabled) { background: var(--surface-muted); }
    .button:active:not(:disabled) { transform: translateY(1px); }
    .button:disabled { opacity: .58; cursor: not-allowed; }
    .button svg { width: 17px; height: 17px; }
    .new-conversation { flex: 0 0 auto; }

    .conversation {
      min-height: 300px;
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
      padding: 28px clamp(18px, 5vw, 52px);
      scroll-behavior: smooth;
    }

    .empty-state {
      width: min(100%, 520px);
      margin: auto;
      padding: 28px 12px;
      text-align: center;
    }

    .empty-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--surface-muted);
      color: var(--accent);
    }

    .empty-icon svg { width: 27px; height: 27px; }
    .empty-state h2 { margin: 0; font-size: clamp(20px, 4vw, 25px); letter-spacing: -.035em; }
    .empty-state p { margin: 9px 0 20px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .examples { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; }
    .example-chip {
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      transition: border-color 160ms ease, color 160ms ease, background-color 160ms ease;
    }
    .example-chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

    .message {
      width: fit-content;
      max-width: min(78%, 590px);
      display: flex;
      flex-direction: column;
      gap: 8px;
      animation: message-in 220ms ease-out both;
    }

    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.assistant { align-self: flex-start; align-items: flex-start; }
    .message-label { padding: 0 3px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .035em; }
    .bubble {
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 17px 17px 17px 5px;
      background: var(--surface-muted);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .message.user .bubble {
      border-color: transparent;
      border-radius: 17px 17px 5px 17px;
      background: var(--user-bubble);
      color: var(--user-ink);
    }

    .audio-control {
      min-height: 32px;
      padding: 0 10px;
      border-color: transparent;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
    }
    .audio-control svg { width: 14px; height: 14px; }
    .audio-control[hidden] { display: none; }

    .composer {
      padding: 18px clamp(16px, 4vw, 32px) 22px;
      border-top: 1px solid var(--line);
      background: var(--surface);
    }

    .status-row {
      min-height: 27px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
    }
    .status.error { color: var(--error); }
    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #9aa4b6;
    }
    .status.recording .status-dot { background: #e5484d; animation: pulse 1.25s ease-in-out infinite; }
    .status.processing .status-dot { background: var(--accent); animation: pulse .9s ease-in-out infinite; }
    .meter {
      width: 90px;
      height: 7px;
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 99px;
      background: var(--meter-track);
    }
    .meter-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), #8b83f2);
      transition: width 80ms linear;
    }
    .meter[hidden] { display: none; }

    .error-banner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
      padding: 11px 12px;
      border: 1px solid color-mix(in srgb, var(--error) 25%, transparent);
      border-radius: 12px;
      background: var(--error-bg);
      color: var(--error);
      font-size: 13px;
      line-height: 1.45;
    }
    .error-banner[hidden] { display: none; }
    .dismiss-error {
      display: grid;
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: inherit;
      cursor: pointer;
    }
    .dismiss-error svg { width: 15px; height: 15px; }

    .voice-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .record-button {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      padding: 0;
      border: 0;
      border-radius: 15px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 7px 16px color-mix(in srgb, var(--accent) 25%, transparent);
      transition: background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease;
    }
    .record-button:hover:not(:disabled) { background: var(--accent-strong); transform: translateY(-1px); }
    .record-button:disabled { opacity: .56; cursor: not-allowed; box-shadow: none; }
    .record-button svg { width: 21px; height: 21px; }
    .record-button .stop-icon { display: none; }
    .record-button.recording { background: #d83a46; animation: record-glow 1.6s ease-in-out infinite; }
    .record-button.recording .mic-icon { display: none; }
    .record-button.recording .stop-icon { display: block; }
    .voice-copy { min-width: 0; }
    .voice-copy strong { display: block; font-size: 13px; font-weight: 650; }
    .voice-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 12px 0;
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .divider::before, .divider::after { height: 1px; flex: 1; background: var(--line); content: ""; }
    .text-form { display: flex; gap: 9px; }
    .text-input {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--ink);
      font-size: 13px;
    }
    .text-input::placeholder { color: var(--muted); opacity: .8; }
    .text-input:disabled { opacity: .6; }
    .send-button {
      min-width: 82px;
      min-height: 44px;
      border-color: transparent;
      background: var(--ink);
      color: var(--surface);
    }
    .send-button:hover:not(:disabled) { background: var(--accent); color: #fff; }
    .send-button svg { width: 16px; height: 16px; }

    .spinner {
      width: 13px;
      height: 13px;
      border: 2px solid color-mix(in srgb, var(--accent) 25%, transparent);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    .spinner[hidden] { display: none; }

    @keyframes pulse { 50% { opacity: .38; transform: scale(.86); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes record-glow {
      50% { box-shadow: 0 0 0 7px rgb(216 58 70 / 13%); }
    }
    @keyframes message-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      body { padding: 0; background: var(--surface); }
      .app { min-height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
      .topbar { padding: 17px 16px; }
      .brand-mark { width: 38px; height: 38px; border-radius: 12px; }
      h1 { font-size: 15px; }
      .subtitle { max-width: 210px; font-size: 11px; }
      .new-conversation { min-height: 37px; padding: 0 10px; font-size: 11px; }
      .conversation { padding: 22px 16px; }
      .message { max-width: 88%; }
      .composer { padding: 14px 16px max(18px, env(safe-area-inset-bottom)); }
      .meter { width: 66px; }
      .status-row { gap: 8px; }
      .status { font-size: 11px; }
      .send-button { min-width: 48px; padding: 0 12px; }
      .send-button .send-label { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <!-- App identity and conversation reset. -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v2M8.5 7v10M12 5v14M15.5 8v8M19 10v4M5 10v4"></path>
            <path d="M4 21h16"></path>
          </svg>
        </div>
        <div>
          <h1>Voice Notion Agent</h1>
          <p class="subtitle">Your voice-first workspace assistant</p>
        </div>
      </div>
      <button class="button new-conversation" id="newConversation" type="button" aria-label="Start a new conversation">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
          <path d="M10 4v12M4 10h12"></path>
        </svg>
        New conversation
      </button>
    </header>

    <!-- Messages are appended as text nodes and the view follows the newest turn. -->
    <section class="conversation" id="conversation" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Conversation">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v2M8 7v10M12 5v14M16 7v10M20 10v4M4 10v4"></path>
          </svg>
        </div>
        <h2>What can I help you with?</h2>
        <p>Ask a question, explore an idea, or get things done in Notion and Gmail.</p>
        <div class="examples" aria-label="Example prompts">
          <button class="example-chip" type="button" data-example="Research about Neil Armstrong">Research about Neil Armstrong</button>
          <button class="example-chip" type="button" data-example="Create a Notion page titled AI Agents">Create a Notion page titled AI Agents</button>
        </div>
      </div>
    </section>

    <!-- Voice and text controls share status, error, and processing feedback. -->
    <section class="composer" aria-label="Message composer">
      <div class="status-row">
        <div class="status" id="statusLine" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">Ready when you are</span>
          <span class="spinner" id="spinner" aria-hidden="true" hidden></span>
        </div>
        <div class="meter" id="meter" aria-label="Microphone input level" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
          <div class="meter-fill" id="meterFill"></div>
        </div>
      </div>
      <div class="error-banner" id="errorBanner" role="alert" hidden>
        <span id="errorMessage"></span>
        <button class="dismiss-error" id="dismissError" type="button" aria-label="Dismiss error">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="m5 5 10 10M15 5 5 15"></path>
          </svg>
        </button>
      </div>
      <div class="voice-controls">
        <button class="record-button" id="recordButton" type="button" aria-label="Start recording" aria-pressed="false">
          <svg class="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="12" rx="3"></rect>
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"></path>
          </svg>
          <svg class="stop-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2"></rect>
          </svg>
        </button>
        <div class="voice-copy">
          <strong id="recordLabel">Tap to speak</strong>
          <span>Record a voice message</span>
        </div>
      </div>
      <div class="divider">or type a message</div>
      <form class="text-form" id="textForm">
        <input class="text-input" id="textInput" name="text" type="text" autocomplete="off" placeholder="Ask Voice Notion Agent..." aria-label="Type your message">
        <button class="button send-button" id="sendButton" type="submit" aria-label="Send message">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17 3 9 11M17 3l-5 14-3-6-6-3 14-5Z"></path>
          </svg>
          <span class="send-label">Send</span>
        </button>
      </form>
    </section>
  </main>

  <script>
    "use strict";

    // Keep each page load's conversation isolated from other browser sessions.
    let sessionId = crypto.randomUUID();
    let state = "idle";
    let recording = null;
    let isStartingRecording = false;
    let startRequestId = 0;
    let requestId = 0;
    let requestController = null;
    let activeAudio = null;
    const audioUrls = new Set();

    const conversation = document.getElementById("conversation");
    const emptyState = document.getElementById("emptyState");
    const statusLine = document.getElementById("statusLine");
    const statusText = document.getElementById("statusText");
    const spinner = document.getElementById("spinner");
    const meter = document.getElementById("meter");
    const meterFill = document.getElementById("meterFill");
    const errorBanner = document.getElementById("errorBanner");
    const errorMessage = document.getElementById("errorMessage");
    const recordButton = document.getElementById("recordButton");
    const recordLabel = document.getElementById("recordLabel");
    const textInput = document.getElementById("textInput");
    const sendButton = document.getElementById("sendButton");

    function setStatus(message, nextState) {
      if (nextState) state = nextState;
      statusText.textContent = message;
      statusLine.classList.toggle("recording", state === "recording");
      statusLine.classList.toggle("processing", state === "processing");
      statusLine.classList.toggle("error", state === "error");
      spinner.hidden = state !== "processing";
      recordButton.classList.toggle("recording", state === "recording");
      recordButton.setAttribute("aria-pressed", String(state === "recording"));
      recordButton.setAttribute("aria-label", state === "recording" ? "Stop recording" : "Start recording");
      recordLabel.textContent = state === "recording" ? "Tap to stop" : "Tap to speak";
      const locked = state === "processing";
      recordButton.disabled = locked || isStartingRecording;
      textInput.disabled = locked || state === "recording" || isStartingRecording;
      sendButton.disabled = locked || state === "recording" || isStartingRecording;
    }

    function showError(message) {
      const text = message || "Something went wrong. Please try again.";
      errorMessage.textContent = text;
      errorBanner.hidden = false;
      setStatus(text, "error");
    }

    function clearError() {
      errorBanner.hidden = true;
      errorMessage.textContent = "";
      if (state === "error") setStatus("Ready when you are", "idle");
    }

    function scrollToLatest() {
      conversation.scrollTop = conversation.scrollHeight;
    }

    function appendMessage(role, text) {
      emptyState.hidden = true;
      const message = document.createElement("article");
      message.className = `message ${role}`;

      const label = document.createElement("span");
      label.className = "message-label";
      label.textContent = role === "user" ? "YOU" : "VOICE NOTION AGENT";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      message.append(label, bubble);
      conversation.append(message);
      scrollToLatest();
      return { message, bubble };
    }

    function makeIcon(name) {
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 20 20");
      svg.setAttribute("fill", "none");
      svg.setAttribute("stroke", "currentColor");
      svg.setAttribute("stroke-width", "1.8");
      svg.setAttribute("stroke-linecap", "round");
      svg.setAttribute("stroke-linejoin", "round");
      svg.setAttribute("aria-hidden", "true");
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", name === "stop" ? "M6 6h8v8H6z" : "M8 5v10l8-5-8-5Z");
      if (name === "stop") path.setAttribute("fill", "currentColor");
      svg.append(path);
      return svg;
    }

    function stopAudio() {
      if (!activeAudio) return;
      activeAudio.pause();
      activeAudio.currentTime = 0;
      activeAudio = null;
    }

    function addAudioControl(message, audioBase64, mimeType) {
      let bytes;
      try {
        const binary = atob(audioBase64);
        bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
      } catch {
        const control = document.createElement("button");
        control.className = "button audio-control";
        control.type = "button";
        control.textContent = "Audio unavailable";
        control.disabled = true;
        message.append(control);
        return;
      }

      const blob = new Blob([bytes], { type: mimeType || "audio/mpeg" });
      const url = URL.createObjectURL(blob);
      audioUrls.add(url);
      const audio = document.createElement("audio");
      audio.preload = "none";
      audio.src = url;
      audio.setAttribute("aria-label", "Assistant reply audio");
      audio.hidden = true;

      const control = document.createElement("button");
      control.className = "button audio-control";
      control.type = "button";
      control.setAttribute("aria-label", "Play assistant reply audio");

      function showPlay() {
        control.replaceChildren(makeIcon("play"), document.createTextNode("Play"));
        control.setAttribute("aria-label", "Play assistant reply audio");
      }

      function showStop() {
        control.replaceChildren(makeIcon("stop"), document.createTextNode("Stop"));
        control.setAttribute("aria-label", "Stop assistant reply audio");
      }

      audio.addEventListener("ended", () => {
        if (activeAudio === audio) activeAudio = null;
        showPlay();
      });
      audio.addEventListener("error", () => {
        if (activeAudio === audio) activeAudio = null;
        showPlay();
      });
      control.addEventListener("click", async () => {
        if (!audio.paused) {
          audio.pause();
          audio.currentTime = 0;
          if (activeAudio === audio) activeAudio = null;
          showPlay();
          return;
        }
        stopAudio();
        activeAudio = audio;
        try {
          await audio.play();
          showStop();
        } catch {
          activeAudio = null;
          showPlay();
        }
      });
      audio.addEventListener("play", showStop);
      audio.addEventListener("pause", () => {
        if (activeAudio !== audio) showPlay();
      });
      message.append(control, audio);

      stopAudio();
      activeAudio = audio;
      audio.play().then(showStop).catch(() => {
        if (activeAudio === audio) activeAudio = null;
        showPlay();
      });
    }

    function cleanAudioUrls() {
      stopAudio();
      for (const url of audioUrls) URL.revokeObjectURL(url);
      audioUrls.clear();
    }

    function pickSupportedMimeType() {
      const candidates = [
        "audio/webm;codecs=opus",
        "audio/webm",
        "audio/ogg;codecs=opus",
        "audio/mp4"
      ];
      if (typeof MediaRecorder === "undefined") return "";
      return candidates.find((type) => MediaRecorder.isTypeSupported(type)) || "";
    }

    function cleanupRecording(run) {
      if (run.timerId) window.clearInterval(run.timerId);
      if (run.animationFrameId) cancelAnimationFrame(run.animationFrameId);
      if (run.stream) run.stream.getTracks().forEach((track) => track.stop());
      if (run.audioContext && run.audioContext.state !== "closed") {
        run.audioContext.close().catch((error) => console.warn("Could not close the audio context:", error));
      }
      meter.hidden = true;
      meterFill.style.width = "0%";
      meter.setAttribute("aria-valuenow", "0");
      if (recording === run) recording = null;
    }

    function startMeter(run) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;

      try {
        run.audioContext = new AudioContextClass();
        const source = run.audioContext.createMediaStreamSource(run.stream);
        run.analyser = run.audioContext.createAnalyser();
        run.analyser.fftSize = 512;
        source.connect(run.analyser);
        run.samples = new Uint8Array(run.analyser.fftSize);
        meter.hidden = false;

        const draw = () => {
          if (recording !== run || !run.analyser) return;
          run.analyser.getByteTimeDomainData(run.samples);
          let sum = 0;
          for (const sample of run.samples) {
            const amplitude = (sample - 128) / 128;
            sum += amplitude * amplitude;
          }
          const level = Math.min(100, Math.round(Math.sqrt(sum / run.samples.length) * 260));
          meterFill.style.width = `${level}%`;
          meter.setAttribute("aria-valuenow", String(level));
          run.animationFrameId = requestAnimationFrame(draw);
        };
        draw();
        if (run.audioContext.state === "suspended") run.audioContext.resume().catch((error) => console.warn("Could not resume the audio meter:", error));
      } catch (error) {
        console.warn("The audio level meter could not start:", error);
        meter.hidden = true;
      }
    }

    function explainMicrophoneError(error) {
      if (error && (error.name === "NotAllowedError" || error.name === "SecurityError")) {
        return "Microphone permission was denied. Allow microphone access in your browser and try again.";
      }
      if (error && (error.name === "NotFoundError" || error.name === "DevicesNotFoundError")) {
        return "No microphone was found. Connect a microphone and try again.";
      }
      if (error && (error.name === "NotReadableError" || error.name === "TrackStartError")) {
        return "The microphone is unavailable. Check that it is not being used by another app.";
      }
      return error && error.message
        ? `Could not start recording: ${error.message}`
        : "Could not access the microphone. Check your browser permissions and try again.";
    }

    async function startRecording() {
      clearError();
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError("Microphone access is unavailable. Use a secure connection or type your message instead.");
        return;
      }
      if (typeof MediaRecorder === "undefined") {
        showError("This browser does not support audio recording. Type your message instead.");
        return;
      }

      const thisStartRequest = ++startRequestId;
      isStartingRecording = true;
      setStatus("Requesting microphone...", "idle");
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (thisStartRequest !== startRequestId) {
          stream.getTracks().forEach((track) => track.stop());
          return;
        }

        const mimeType = pickSupportedMimeType();
        const recorderInstance = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
        const run = {
          recorder: recorderInstance,
          stream,
          chunks: [],
          mimeType: mimeType || recorderInstance.mimeType || "audio/webm",
          startedAt: performance.now(),
          timerId: null,
          animationFrameId: null,
          audioContext: null,
          analyser: null,
          samples: null,
          discard: false,
          conversationId: sessionId
        };
        recording = run;
        recorderInstance.addEventListener("dataavailable", (event) => {
          if (event.data && event.data.size > 0) run.chunks.push(event.data);
        });
        recorderInstance.addEventListener("stop", () => {
          const duration = performance.now() - run.startedAt;
          cleanupRecording(run);
          if (run.discard || run.conversationId !== sessionId) return;
          if (duration < 1000) {
            setStatus("Too short, hold for at least 1 second", "idle");
            return;
          }
          const blob = new Blob(run.chunks, { type: run.mimeType });
          if (blob.size === 0) {
            showError("No audio was captured. Please try recording again.");
            return;
          }
          const extension = run.mimeType.includes("ogg") ? "ogg" : run.mimeType.includes("mp4") ? "mp4" : "webm";
          sendVoice(blob, `recording.${extension}`, run.conversationId);
        });
        recorderInstance.addEventListener("error", (event) => {
          run.discard = true;
          cleanupRecording(run);
          showError(event.error && event.error.message ? `Recording failed: ${event.error.message}` : "Recording failed. Please try again.");
        });
        recorderInstance.start();
        startMeter(run);
        setStatus("Recording... 0.0s", "recording");
        run.timerId = window.setInterval(() => {
          const elapsed = (performance.now() - run.startedAt) / 1000;
          statusText.textContent = `Recording... ${elapsed.toFixed(1)}s`;
        }, 100);
      } catch (error) {
        if (stream) stream.getTracks().forEach((track) => track.stop());
        showError(explainMicrophoneError(error));
      } finally {
        if (thisStartRequest === startRequestId) {
          isStartingRecording = false;
          recordButton.disabled = state === "processing";
          textInput.disabled = state === "processing" || state === "recording";
          sendButton.disabled = state === "processing" || state === "recording";
        }
      }
    }

    function stopRecording() {
      if (!recording) return;
      try {
        if (recording.recorder.state !== "inactive") recording.recorder.stop();
      } catch (error) {
        const failedRun = recording;
        failedRun.discard = true;
        cleanupRecording(failedRun);
        showError(`Could not stop recording: ${error.message || "Please try again."}`);
      }
    }

    async function readApiResponse(response) {
      let payload;
      try {
        payload = await response.json();
      } catch {
        throw new Error(response.ok ? "The server returned an invalid response." : `Request failed with status ${response.status}.`);
      }
      if (!response.ok) {
        throw new Error(payload && typeof payload.detail === "string" ? payload.detail : `Request failed with status ${response.status}.`);
      }
      if (!payload || typeof payload.reply !== "string" || typeof payload.transcript !== "string") {
        throw new Error("The server response is missing the transcript or reply.");
      }
      return payload;
    }

    async function sendVoice(blob, filename, conversationId) {
      const currentRequest = ++requestId;
      requestController = new AbortController();
      const controller = requestController;
      const formData = new FormData();
      formData.append("audio", blob, filename);
      formData.append("session_id", conversationId);
      setStatus("Transcribing and thinking...", "processing");
      try {
        const response = await fetch("/api/voice", {
          method: "POST",
          body: formData,
          signal: controller.signal
        });
        const payload = await readApiResponse(response);
        if (currentRequest !== requestId || conversationId !== sessionId) return;
        appendMessage("user", payload.transcript);
        const assistant = appendMessage("assistant", payload.reply);
        if (payload.audio_base64) addAudioControl(assistant.message, payload.audio_base64, payload.audio_mime);
        setStatus("Ready when you are", "idle");
      } catch (error) {
        if (error.name === "AbortError" || currentRequest !== requestId) return;
        showError(error instanceof TypeError ? "Network error. Check your connection and try again." : error.message);
      } finally {
        if (currentRequest === requestId) {
          requestController = null;
          if (state === "processing") setStatus("Ready when you are", "idle");
        }
      }
    }

    async function sendText(text) {
      const currentRequest = ++requestId;
      const conversationId = sessionId;
      requestController = new AbortController();
      const controller = requestController;
      setStatus("Thinking...", "processing");
      try {
        const response = await fetch("/api/text", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, session_id: conversationId }),
          signal: controller.signal
        });
        const payload = await readApiResponse(response);
        if (currentRequest !== requestId || conversationId !== sessionId) return;
        appendMessage("user", payload.transcript);
        const assistant = appendMessage("assistant", payload.reply);
        if (payload.audio_base64) addAudioControl(assistant.message, payload.audio_base64, payload.audio_mime);
        textInput.value = "";
        setStatus("Ready when you are", "idle");
      } catch (error) {
        if (error.name === "AbortError" || currentRequest !== requestId) return;
        showError(error instanceof TypeError ? "Network error. Check your connection and try again." : error.message);
      } finally {
        if (currentRequest === requestId) {
          requestController = null;
          if (state === "processing") setStatus("Ready when you are", "idle");
        }
      }
    }

    function beginNewConversation() {
      startRequestId += 1;
      isStartingRecording = false;
      if (recording) {
        const run = recording;
        run.discard = true;
        cleanupRecording(run);
        if (run.recorder.state !== "inactive") run.recorder.stop();
      }
      if (requestController) requestController.abort();
      requestController = null;
      requestId += 1;
      sessionId = crypto.randomUUID();
      cleanAudioUrls();
      for (const message of conversation.querySelectorAll(".message")) message.remove();
      emptyState.hidden = false;
      errorBanner.hidden = true;
      errorMessage.textContent = "";
      setStatus("Ready when you are", "idle");
      textInput.value = "";
      textInput.focus();
    }

    recordButton.addEventListener("click", () => {
      if (state === "recording") stopRecording();
      else if (state !== "processing" && !isStartingRecording) startRecording();
    });

    document.getElementById("textForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const text = textInput.value.trim();
      if (text && state !== "processing" && state !== "recording") sendText(text);
    });

    document.querySelectorAll("[data-example]").forEach((button) => {
      button.addEventListener("click", () => {
        if (state === "processing" || state === "recording") return;
        sendText(button.dataset.example);
      });
    });

    document.getElementById("newConversation").addEventListener("click", beginNewConversation);
    document.getElementById("dismissError").addEventListener("click", clearError);

    window.addEventListener("pagehide", () => {
      if (recording) {
        recording.discard = true;
        cleanupRecording(recording);
        if (recording && recording.recorder.state !== "inactive") recording.recorder.stop();
      }
      cleanAudioUrls();
    });
  </script>
</body>
</html>
